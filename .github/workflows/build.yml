name: Windows-VST3 bauen

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']   # Doku-Aenderungen loesen keinen neuen Bau aus
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          "DOP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Konfigurieren
        run: cmake -B build -A x64 -DDOPPELGANGER_PLUGIN_TESTS=ON

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Regressionstests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Plugin bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Doppelganger-VST3-Windows
          path: build/Doppelganger_artefacts/Release/VST3
          if-no-files-found: error

      - name: Stabilitaetstest (pluginval)
        shell: pwsh
        run: |
          curl.exe -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 8 --validate-in-process --validate "build/Doppelganger_artefacts/Release/VST3/Doppelganger.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: ZIP packen
        shell: pwsh
        run: Compress-Archive -Path "build/Doppelganger_artefacts/Release/VST3/Doppelganger.vst3" -DestinationPath "Doppelganger-VST3-Windows.zip"

      - name: Release mit ZIP erstellen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DOP_VERSION }}-b${{ github.run_number }}
          name: Doppelganger v${{ env.DOP_VERSION }}
          make_latest: true
          files: |
            Doppelganger-VST3-Windows.zip
          # Bei einer neuen VERSION die passenden Release-Hinweise mitpflegen.
          body_path: docs/releases/${{ env.DOP_VERSION }}.md
