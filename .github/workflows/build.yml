name: Windows-VST3 bauen

# Teurer Windows-Lauf (Minuten zaehlen doppelt): laeuft NICHT bei jedem Commit.
#   - von Hand: Actions > "Windows-VST3 bauen" > Run workflow (zur Abnahme);
#     nur mit Haken "publish" auf main entsteht ein Release
#   - bei Pull Requests erst, wenn der PR als "Ready for review" markiert wird
# Siehe docs/CI.md
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Release mit ZIP veroeffentlichen (nur auf main)'
        type: boolean
        default: false
  pull_request:
    branches: [main]
    types: [opened, ready_for_review]   # kein Lauf bei jedem weiteren Push in den PR
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: write

# Ueberholte Laeufe derselben Ref abbrechen (ausser einem Release-Lauf)
concurrency:
  group: windows-vst3-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || ! github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          "DOP_VERSION=$v" >> $env:GITHUB_ENV

      # Schnell scheitern, bevor die Bauminuten verbraucht werden
      - name: Release vorab pruefen
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") { Write-Error "Release nur auf main"; exit 1 }
          if (-not (Test-Path "docs/releases/$env:DOP_VERSION.md")) { Write-Error "docs/releases/$env:DOP_VERSION.md fehlt"; exit 1 }

      - name: Herstelleridentitaet pruefen
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'COMPANY_NAME\s+"Stromschlag Audio"') { throw "Hersteller muss Stromschlag Audio sein" }
          if ($cmake -match '(?i)COMPANY_NAME\s+"[^"]*(Claude|Anthropic)') { throw "Falscher Plugin-Hersteller" }

      - name: Konfigurieren
        run: cmake -B build -A x64 -DDOPPELGANGER_PLUGIN_TESTS=ON

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Regressionstests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Plugin bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Doppelganger-VST3-Windows
          path: build/Doppelganger_artefacts/Release/VST3
          if-no-files-found: error
          retention-days: 7

      - name: Stabilitaetstest (pluginval)
        shell: pwsh
        run: |
          curl.exe -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 8 --validate-in-process --validate "build/Doppelganger_artefacts/Release/VST3/Doppelganger.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: ZIP packen
        shell: pwsh
        run: Compress-Archive -Path "build/Doppelganger_artefacts/Release/VST3/Doppelganger.vst3" -DestinationPath "Doppelganger-VST3-Windows.zip"

      - name: Release mit ZIP erstellen
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DOP_VERSION }}-b${{ github.run_number }}
          name: Doppelganger v${{ env.DOP_VERSION }}
          make_latest: true
          files: |
            Doppelganger-VST3-Windows.zip
          # Bei einer neuen VERSION die passenden Release-Hinweise mitpflegen.
          body_path: docs/releases/${{ env.DOP_VERSION }}.md
